name: Build VFS Addon

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate packaging and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test packaging
        env:
          PYTHONPATH: ${{ github.workspace }}/dev
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import xml.etree.ElementTree as ET
          version = ET.parse('addon.xml').getroot().attrib['version']
          tag = os.environ['GITHUB_REF_NAME']
          assert tag in (version, f'v{version}'), f'Tag {tag} does not match addon.xml {version}'

  build:
    needs: validate
    name: Build ${{ matrix.kodi }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        kodi: [Omega, Piers]
        platform:
          # --- Android (Cross Compile) ---
          - os: android
            arch: aarch64
            runs-on: ubuntu-latest
            triplet: arm64-android
            cmake-args: -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=28 -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME
          
          - os: android
            arch: armv7
            runs-on: ubuntu-latest
            triplet: arm-neon-android
            cmake-args: -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=28 -DCMAKE_ANDROID_ARCH_ABI=armeabi-v7a -DCMAKE_ANDROID_NDK=$ANDROID_NDK_HOME

          # --- Windows ---
          - os: windows
            arch: x86_64
            runs-on: windows-latest
            triplet: x64-windows-static
            cmake-args: -A x64

          - os: windows
            arch: i686
            runs-on: windows-latest
            triplet: x86-windows-static
            cmake-args: -A Win32

          # --- macOS ---
          - os: macos
            arch: x86_64
            runs-on: macos-latest
            triplet: x64-osx
            cmake-args: "-DCMAKE_OSX_ARCHITECTURES=x86_64"

          - os: macos
            arch: arm64
            runs-on: macos-14
            triplet: arm64-osx
            cmake-args: "-DCMAKE_OSX_ARCHITECTURES=arm64"

          # --- Linux (Ubuntu) ---
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
            triplet: x64-linux
            cmake-args: ""

          - os: linux
            arch: i686
            runs-on: ubuntu-latest
            triplet: x86-linux
            cmake-args: -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_C_FLAGS="-m32"

          - os: linux
            arch: aarch64
            runs-on: ubuntu-latest
            triplet: arm64-linux
            cmake-args: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

          - os: linux
            arch: armv7
            runs-on: ubuntu-latest
            triplet: arm-linux
            cmake-args: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++

    steps:
      - uses: actions/checkout@v4

      # 1. 下载 Kodi 源码 (为了头文件)
      - name: Checkout Kodi Source
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: ${{ matrix.kodi }}
          path: kodi_src
          fetch-depth: 1

      # 2. 安装 vcpkg (全平台)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'aebdcca3833a60ad33e4ce848437eee434669ed4' # 锁定为 2026-01-10 版本
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      # 3. 安装依赖 (Linux 基础环境)
      - name: Install Linux Build Tools
        if: matrix.platform.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config build-essential
          if [ "${{ matrix.platform.arch }}" == "i686" ]; then
            sudo apt-get install -y gcc-multilib g++-multilib
          fi
          if [ "${{ matrix.platform.arch }}" == "aarch64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          if [ "${{ matrix.platform.arch }}" == "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      # 4. 编译 (全平台统一使用 vcpkg 清单模式)
      # 即使是 Linux，也使用 vcpkg 编译 release 版的 curl，确保全平台 libcurl 版本完全一致
      - name: Configure and Build (Manifest Mode)
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.platform.triplet }} \
            -DKODI_SOURCE_DIR="${GITHUB_WORKSPACE}/kodi_src" \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.platform.cmake-args }}
          cmake --build build --config Release --parallel

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Addon
        id: package
        shell: bash
        env:
          BUILD_OS: ${{ matrix.platform.os }}
          BUILD_ARCH: ${{ matrix.platform.arch }}
          KODI_CODENAME: ${{ matrix.kodi }}
        run: |
          PLATFORM="$BUILD_OS-$BUILD_ARCH"
          if [ "$BUILD_OS" = "macos" ]; then
            PLATFORM="osx-$BUILD_ARCH"
          fi
          TAG_ARGS=()
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_ARGS=(--tag "$GITHUB_REF_NAME")
          fi
          python dev/package_addon.py \
            --kodi-source kodi_src \
            --kodi "$KODI_CODENAME" \
            --platform "$PLATFORM" \
            "${TAG_ARGS[@]}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: vfs.stream.fast-*
          path: release
          merge-multiple: true

      - name: Verify release packages
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          packages = list(Path('release').glob('*.zip'))
          platforms = ('android-aarch64', 'android-armv7', 'windows-x86_64',
                       'windows-i686', 'osx-x86_64', 'osx-arm64', 'linux-x86_64',
                       'linux-i686', 'linux-aarch64', 'linux-armv7')
          expected = {f'-{kodi}-{platform}.zip'
                      for kodi in ('Omega', 'Piers') for platform in platforms}
          assert len(packages) == len(expected), f'Expected 20 packages, got {len(packages)}'
          for suffix in expected:
              assert sum(p.name.endswith(suffix) for p in packages) == 1, suffix
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  assert archive.testzip() is None, package
                  assert 'vfs.stream.fast/addon.xml' in archive.namelist(), package

      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release/*.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG_NAME"
          fi
